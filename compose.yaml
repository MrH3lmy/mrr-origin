services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mrr_origin
      POSTGRES_USER: mrr_origin
      POSTGRES_PASSWORD: mrr_origin
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrr_origin -d mrr_origin"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mrr_origin_postgres:/var/lib/postgresql/data

volumes:
  mrr_origin_postgres:
