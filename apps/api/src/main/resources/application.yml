spring:
  application:
    name: mrr-origin-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mrr_origin}
    username: ${DATABASE_USERNAME:mrr_origin}
    password: ${DATABASE_PASSWORD:mrr_origin}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
