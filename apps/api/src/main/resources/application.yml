spring:
  application:
    name: mrr-origin-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mrr_origin}
    username: ${DATABASE_USERNAME:mrr_origin}
    password: ${DATABASE_PASSWORD:mrr_origin}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/mrr-origin}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8081/realms/mrr-origin/protocol/openid-connect/certs}
          audiences:
            - ${OIDC_AUDIENCE:mrr-origin-api}

mrrorigin:
  stripe:
    connect:
      # Per ADR-0003, these are the platform's own restricted OAuth client/secret keys -- never a
      # per-workspace credential. Test and live are always kept separate.
      test-client-id: ${STRIPE_CONNECT_TEST_CLIENT_ID:}
      test-secret-key: ${STRIPE_CONNECT_TEST_SECRET_KEY:}
      live-client-id: ${STRIPE_CONNECT_LIVE_CLIENT_ID:}
      live-secret-key: ${STRIPE_CONNECT_LIVE_SECRET_KEY:}
      redirect-uri: ${STRIPE_CONNECT_REDIRECT_URI:}
      state-ttl: ${STRIPE_CONNECT_STATE_TTL:PT15M}

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
