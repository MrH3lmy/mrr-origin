spring:
  application:
    name: mrr-origin-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mrr_origin}
    username: ${DATABASE_USERNAME:mrr_origin}
    password: ${DATABASE_PASSWORD:mrr_origin}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/mrr-origin}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8081/realms/mrr-origin/protocol/openid-connect/certs}
          audiences:
            - ${OIDC_AUDIENCE:mrr-origin-api}

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
