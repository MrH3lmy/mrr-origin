spring:
  application:
    name: mrr-origin-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mrr_origin}
    username: ${DATABASE_USERNAME:mrr_origin}
    password: ${DATABASE_PASSWORD:mrr_origin}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/mrr-origin}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8081/realms/mrr-origin/protocol/openid-connect/certs}
          audiences:
            - ${OIDC_AUDIENCE:mrr-origin-api}

mrrorigin:
  tracking:
    rate-limit:
      # #65: DB-backed per-ingestion-key ceiling on the public ingestion endpoint.
      requests-per-minute: ${INGESTION_RATE_LIMIT_PER_MINUTE:60}
  billing:
    webhook-normalization:
      # #92: bounded background driver for StripeWebhookNormalizationService.processBatch. Safe under
      # multiple replicas/overlapping ticks -- see that service's claim-lease Javadoc. Conservative
      # private-beta defaults: 50 events/batch, at most 10 batches (500 events) per tick, every 30s.
      enabled: ${STRIPE_WEBHOOK_NORMALIZATION_SCHEDULER_ENABLED:true}
      batch-size: ${STRIPE_WEBHOOK_NORMALIZATION_BATCH_SIZE:50}
      max-batches-per-tick: ${STRIPE_WEBHOOK_NORMALIZATION_MAX_BATCHES_PER_TICK:10}
      fixed-delay: ${STRIPE_WEBHOOK_NORMALIZATION_FIXED_DELAY:PT30S}
      initial-delay: ${STRIPE_WEBHOOK_NORMALIZATION_INITIAL_DELAY:PT30S}
  attribution:
    recalculation:
      scheduler:
        # #92: bounded background driver for AttributionRecalculationService.runBatch. One bounded
        # batch per outstanding (workspace, project) scope per tick; never restarts a COMPLETED sweep
        # (see AttributionRecalculationService#pendingScopes). Conservative private-beta defaults: at
        # most 100 customers per scope, 20 scopes per tick, every minute.
        enabled: ${ATTRIBUTION_RECALCULATION_SCHEDULER_ENABLED:true}
        max-customers-per-scope: ${ATTRIBUTION_RECALCULATION_MAX_CUSTOMERS_PER_SCOPE:100}
        max-scopes-per-tick: ${ATTRIBUTION_RECALCULATION_MAX_SCOPES_PER_TICK:20}
        fixed-delay: ${ATTRIBUTION_RECALCULATION_SCHEDULER_FIXED_DELAY:PT1M}
        initial-delay: ${ATTRIBUTION_RECALCULATION_SCHEDULER_INITIAL_DELAY:PT1M}
  stripe:
    connect:
      # Per ADR-0003, these are the platform's own restricted OAuth client/secret keys -- never a
      # per-workspace credential. Test and live are always kept separate.
      test-client-id: ${STRIPE_CONNECT_TEST_CLIENT_ID:}
      test-secret-key: ${STRIPE_CONNECT_TEST_SECRET_KEY:}
      live-client-id: ${STRIPE_CONNECT_LIVE_CLIENT_ID:}
      live-secret-key: ${STRIPE_CONNECT_LIVE_SECRET_KEY:}
      # Per ADR-0003, the Connect webhook signing secret is centrally managed, per mode, and is
      # never a per-workspace value. Test and live deliveries are verified against distinct secrets.
      test-webhook-secret: ${STRIPE_CONNECT_TEST_WEBHOOK_SECRET:}
      live-webhook-secret: ${STRIPE_CONNECT_LIVE_WEBHOOK_SECRET:}
      redirect-uri: ${STRIPE_CONNECT_REDIRECT_URI:}
      state-ttl: ${STRIPE_CONNECT_STATE_TTL:PT15M}
  notification:
    email:
      # Per #59/ADR-0007: Postmark is the only supported provider. Sender/reply-to/web-base-url are
      # intentionally blank by default (no domain/deployment-URL convention exists in this repo) --
      # the scheduler skips dispatch with a logged warning until an operator configures all of them
      # for a given deployment (a compliant email needs a real sender AND a real opt-out link).
      postmark-server-token: ${POSTMARK_SERVER_TOKEN:}
      sender-address: ${WEEKLY_SUMMARY_SENDER_ADDRESS:}
      reply-to-address: ${WEEKLY_SUMMARY_REPLY_TO_ADDRESS:}
      message-stream: ${POSTMARK_MESSAGE_STREAM:outbound}
      request-timeout: ${POSTMARK_REQUEST_TIMEOUT:PT10S}
      # Base URL of the web app, used to build the authenticated opt-out link every weekly summary
      # email must contain (accepted B4). No trailing slash, e.g. https://app.example.com.
      web-base-url: ${WEB_APP_BASE_URL:}

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # P6 observability slice (#28): adds `prometheus` for Prometheus-format metrics scraping.
        # Never widen this beyond an explicit, reviewed list -- see docs/security/threat-model.md #4 and
        # docs/operations/observability-runbook.md for why env/beans/heapdump/etc. must never be
        # exposed and why /actuator/prometheus is permitAll + relies on deployment-level network
        # isolation rather than JWT auth (a Prometheus scraper cannot present a user JWT).
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
